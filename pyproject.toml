[project]
name = "forex-neural-engine"
version = "0.1.0"
description = "Production-Grade Quantitative Forex Trading Engine with Neural Ensembles"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Quantitative Engineering Team"}
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "pandas.*",
    "redis.*",
    "kafka.*",
    "sklearn.*",
    "hmmlearn.*",
    "lightgbm.*",
    "gymnasium.*",
    "stable_baselines3.*",
    "pywt.*",
    "scipy.*",
    "structlog.*"
]
ignore_missing_imports = true
