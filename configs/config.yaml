# Global Environment Configurations
environment: "development" # development, paper, live
pairs:
  - "EUR_USD"
  - "GBP_USD"
  - "USD_JPY"
  - "USD_CHF"

# Time-Series & Microsecond Caching Infrastructure
database:
  timescaledb:
    host: "localhost"
    port: 5432
    username: "postgres"
    password: "secure_password" # Overridden by PG_PASSWORD env
    database: "forex_db"
    pool_min: 5
    pool_max: 20
  redis:
    host: "localhost"
    port: 6379
    password: "" # Overridden by REDIS_PASSWORD env
    db: 0
    max_tick_lookback: 1000

# Streaming Message Bus (Kafka)
kafka:
  bootstrap_servers:
    - "localhost:9092"
  topics:
    ticks: "forex.ticks"
    features: "forex.features"
    signals: "forex.signals"
    orders: "forex.orders"
    fills: "forex.fills"
  consumer_group: "forex-neural-pipeline"

# Feature Engineering Pipelines
features:
  resampling:
    base_timeframe: "1m"
    aggregates: ["5m", "1h", "4h", "1d"]
  microstructure:
    vpin:
      volume_bucket_size: 50
    kyle_lambda:
      window_size: 100
    amihud:
      window_size: 60
  wavelet:
    wavelet_name: "db4"
    level: 5
  kalman:
    process_noise: 1e-4
    observation_noise: 1e-2

# Neural Ensemble Models
models:
  temporal:
    seq_len: 60
    d_model: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1
  regime:
    n_states: 4
    hmm_features: ["volatility_cc", "mean_reversion_hurst", "trend_strength", "vpin"]
  rl_agent:
    algorithm: "PPO"
    learning_rate: 3e-4
    n_steps: 2048
    batch_size: 64
    ent_coef: 0.01
    gamma: 0.99
    gae_lambda: 0.95
  meta_learner:
    adaptation_steps: 5
    support_set_size: 50
    inner_lr: 1e-2
    outer_lr: 1e-4
  ensemble:
    aggregation_method: "stacking" # stacking, bma
    mc_dropout_samples: 50
    stacking_meta_model: "lightgbm"
    direction_threshold: 0.0008

# Institutional-Grade Risk Gating
risk:
  sizing:
    method: "kelly" # kelly, fixed, volatility
    kelly_fraction: 0.15
    max_account_risk_pct: 0.02
  circuit_breakers:
    daily_drawdown_limit: 0.03
    weekly_drawdown_limit: 0.06
    monthly_drawdown_limit: 0.10
  limits:
    cvar_confidence: 0.95
    max_open_positions: 5
    max_correlation_exposure: 0.70

# Execution & Broker API Connections
execution:
  broker: "paper" # paper, oanda, lmax, ib
  slippage:
    base_spread_pct: 0.0001
    market_impact_coefficient: 0.05
  smart_routing:
    routing_enabled: true
    twap_slice_interval_sec: 60
    vwap_volume_participation_rate: 0.10
